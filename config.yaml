# Koa API 服务配置
server:
    protocol:
        value: http
        comment: 服务协议
    host:
        value: localhost
        comment: 监听地址及对外访问主机名
    port:
        value: 3000
        comment: API 服务端口
    videoConfigPrefix:
        value: ''
        comment: 配置文件名前缀
    dataFile:
        value: .video.json
        comment: 视频数据索引文件名
    allowedImageExtensions:
        value:
            - .jpg
            - .jpeg
            - .png
            - .webp
            - .gif
        comment: 允许作为系列图片的文件扩展名
    allowedVideoExtensions:
        value:
            - .mp4
            - .mkv
            - .avi
            - .flv
            - .m4v
            - .mov
            - .webm
            - .wmv
        comment: 允许作为视频的文件扩展名
    dataFileSaveDelay:
        value: 500
        comment: 数据文件保存防抖延迟（毫秒）

# 日志落盘与缓冲配置
logging:
    directory:
        value: logs
        comment: 日志根目录；相对路径基于进程当前工作目录
    fileEnabled:
        value: true
        comment: 是否启用异步文件落盘
    components:
        value: [app, http, web, hls]
        comment: transport 允许的 component 目录
    sources:
        value: [access, business, error, startup, shutdown, native, manager, request, transport, default]
        comment: transport 允许的 source 文件名
    httpEventSource:
        value:
            http.request.completed: access
            http.request.failed: error
            http.request.rejected: error
        comment: HTTP 事件到 source 的精确映射
    httpBusinessPrefixes:
        value: [series., season., episode., directories., system.]
        comment: HTTP 业务事件前缀
    fileMaxBytes:
        value: 52428800
        comment: 单个日志文件最大字节数
    retentionDays:
        value: 30
        comment: 按日期目录保留的天数；0 禁用过期清理
    maxQueueBytes:
        value: 4194304
        comment: 主线程待写及在途日志的字节上限；过载时丢弃新记录并向 stderr 告警
    bufferBytes:
        value: 65536
        comment: transport 内存批量缓冲大小
    flushIntervalMs:
        value: 250
        comment: 低流量缓冲的定时提交间隔（毫秒），不包含排队和磁盘耗时

# Web 静态文件及开发代理服务配置
web:
    protocol:
        value: http
        comment: Web 服务协议
    host:
        value: localhost
        comment: Web 服务主机名
    port:
        value: 3001
        comment: Web 服务端口
    devWebPort:
        value: 5173
        comment: Vite 开发服务器端口
    webBundleDir:
        value: www
        comment: Web 静态资源目录

# HLS 播放列表、分片及预览图配置
hls:
    masterM3u8Name:
        value: master
        comment: 各类 m3u8 播放列表的文件名（不含扩展名）
    mediaM3u8Name:
        value: media
        comment: 视频媒体播放列表的文件名（不含扩展名）
    subtitleM3u8Name:
        value: subtitle
        comment: 字幕播放列表的文件名（不含扩展名）
    imageM3u8Name:
        value: image
        comment: 预览图播放列表的文件名（不含扩展名）
    globalSegmentConcurrency:
        value: 2
        comment: 全局 HLS 分片任务并发数
    segmentMinDuration:
        value: 4
        comment: 视频分片的最短时长（秒）
    contextPoolSize:
        value: 4
        comment: HLS 转码上下文池大小
    imageMaxConcurrency:
        value: 1
        comment: 预览图生成的最大并发数
    imageOutputWidth:
        value: 320
        comment: 预览图输出宽度（像素）
    imageOutputHeight:
        value: 180
        comment: 预览图输出高度（像素）
    imageMaxSegmentBytes:
        value: 51200
        comment: 单个预览图分片的最大大小（字节）
    imageMaxJpegBytes:
        value: 47104
        comment: 单张 JPEG 预览图的最大大小（字节）
    imageMaxCacheBytes:
        value: 8388608
        comment: 预览图缓存的最大总大小（字节）
